#intro
intro.title		= Einführung
intro.challenge	= <p>Hallo. Um den Reaktionseditor unten zu benutzen, gib die beiden Reaktanten ein (z.B. a0 und c0) und lege fest, was mit ihnen geschehen soll, z.B. dass sie sich binden und beide den Zustand 1 annehmen (a0+c0=>a1c1). Klicke auf 'Reaktion hinzufügen', um sie der Liste der aktiven Reaktionen hinzuzufügen, und beobachte, was rechts passiert. Klicke auf 'Zurücksetzen', um von vorne zu beginnen. Wenn du bereit bist, benutze die Navigations-Buttons oben, um eine Reihe von Tests deiner organischen Baufähigkeiten zu starten.</p>
intro.hint		=

#joinas
joinas.title		= Gruppe
joinas.challenge	= <p>Verbinde alle 'a'-Atome. Erstelle mit dem Reaktionseditor unten Regeln, die nur die 'a'-Atome zusammenkleben lassen. Klicke auf 'Auswerten', wenn du es geschafft hast, um zur nächsten Aufgabe zu wechseln.</p>
joinas.hint			= Du solltest nur eine Reaktion brauchen. Du kannst Atome ziehen, um Zeit zu sparen.
joinas.error.1		= Einige andere Atomtypen haben Bindungen.
joinas.error.2		= Nicht alle 'a'-Atome sind miteinander verbunden.

#makeecs
makeecs.title		= Paar
makeecs.challenge	= <p>Bilde 'ec'-Paare. Entwerfe Reaktionen, die 'e'- und 'c'-Atome zu Paaren verbinden, aber keine anderen Atome.</p>
makeecs.hint		= Du solltest nur eine Reaktion brauchen.
makeecs.error.1		= Einige andere Atomtypen haben Bindungen.
makeecs.error.2		= Einige 'e'- oder 'c'-Atome haben mehr als eine Bindung.
makeecs.error.3		= Nicht alle 'e'- oder 'c'-Atome sind verpaart.

#linecs
linecs.title		= Linie
linecs.challenge	= <p>Verbinde alle 'c'-Atome zu einer langen Linie.</p>
linecs.hint			= Wir haben ein 'c'-Atom im Zustand 1 als Start vorgegeben. Behalte ein Atom als 'wachsendes' Ende.
linecs.error.1		= Einige andere Atome haben Bindungen.
linecs.error.2		= Ungebundene 'c'-Atome.
linecs.error.3		= Fehlerhafte Kette - die Atome müssen in einer einzigen Linie verbunden sein.
linecs.error.4		= Nicht alle 'c'-Atome sind in einer Kette.
linecs.error.5		= Die Kette muss offene Enden haben.

#joinall
joinall.title		= Abkürzung
joinall.challenge 	= <p>Verbinde jedes Atom miteinander.</p>
joinall.hint		= Du kannst 'x' und 'y' als Variablen benutzen.
joinall.error.1		= Nicht alle Atome sind miteinander verbunden.

#connectcorners
connectcorners.title		= Seil
connectcorners.challenge	= <p>Verbinde die zwei fixierten Atome.</p>
connectcorners.hint			=
connectcorners.error.1		= Die zwei fixierten Atome sind nicht verbunden.

#abcdefchains
abcdefchains.title		= Kette
abcdefchains.challenge	= <p>Bilde 'abcdef'-Ketten.</p>
abcdefchains.hint		= Du wirst mehrere Reaktionen brauchen.
abcdefchains.error.1	= Keine abcdef-Ketten gefunden.
abcdefchains.error.2	= Nur eine abcdef-Kette gefunden - streng dich an!

#joinsame
joinsame.title		= Mehrere Gruppen
joinsame.challenge	= <p>Verbinde alle Atome der gleichen Farbe miteinander.</p>
joinsame.hint		= Benutze die Variable 'x' zweimal, um Atome des gleichen Typs zu verbinden.
joinsame.error.1	= Atome verschiedener Typen verbunden.
joinsame.error.2	= Nicht alle Atome jedes Typs sind verbunden.

#matchtemplate
matchtemplate.title		= Kopie
matchtemplate.challenge	= <p>Füge zu jedem Atom in der Vorlage ein passendes Atom hinzu.</p>
matchtemplate.hint		= Benutze nur eine Reaktion.
matchtemplate.error.1	= Vorlage nicht korrekt ergänzt.

#breakmolecule
breakmolecule.title		= Bruch
breakmolecule.challenge	= <p>Zerbreche das Molekül in zwei Hälften.</p>
breakmolecule.hint		= Benutze die Checkboxen im Reaktionseditor, um festzulegen, dass die Reaktanten vorher gebunden und nachher ungebunden sein sollen.
breakmolecule.error.1	= Das Molekül muss sauber in der Mitte geteilt werden.

#bondprisoner
bondprisoner.title		= Allein
bondprisoner.challenge	= <p>Verbinde das gefangene 'f'-Atom mit einem anderen 'f'.</p>
bondprisoner.hint		=
bondprisoner.error.1	= Das ursprüngliche 'f'-Atom ist nicht gebunden.
bondprisoner.error.2	= Das ursprüngliche 'f'-Atom ist an einen anderen Typ gebunden.

#passmessage
passmessage.title		= Nachricht
passmessage.challenge	= <p>Leite eine Nachricht durch das Molekül. Lass den Zustand '2' durch das vorgegebene Molekül wandern, ohne die Bindungen zu ändern, sodass alle Atome am Ende im Zustand 2 sind. Wähle Reaktionen, die bei jeder Sequenz funktionieren.</p>
passmessage.hint		= Aktiviere beide Checkboxen, damit die Reaktion nur auf gebundene Atome wirkt und sie gebunden lässt.
passmessage.error.1		= Die Bindungen dürfen nicht verändert werden.
passmessage.error.2		= Jedes Atom im Molekül sollte Zustand 2 haben.

#splitladder
splitladder.title		= Zwillinge
splitladder.challenge	= <p>Teile das Molekül in zwei gleiche Hälften. Wähle Reaktionen, die bei jeder Sequenz funktionieren.</p>
splitladder.hint		= Beginne am Ende mit den zwei '2'-Atomen. Du wirst sowohl Nachrichten-Weitergabe als auch Teilung brauchen.
splitladder.error.1		= Die Moleküle sind nicht korrekt geteilt.

#insertatom
insertatom.title		= Einfügen
insertatom.challenge	= <p>Füge ein 'b'-Atom in die Mitte des Moleküls ein, zwischen e2 und e3.</p>
insertatom.hint			=
insertatom.error.1		= Das entstehende Molekül sollte 11 Atome haben.
insertatom.error.2		= Das entstehende Molekül sollte eine einzige Kette sein.
insertatom.error.3		= Das Atom sollte sauber genau in der Mitte eingefügt werden.

#makeladder
makeladder.title		= Leiter
makeladder.challenge	= <p>Füge passende Atome an die Vorlage und verbinde sie sauber wie eine Leiter oder DNA. Wähle Reaktionen, die bei jeder Sequenz funktionieren, da sich die Sequenz bei jedem Zurücksetzen ändert.</p>
makeladder.hint			= Die Vorlage hat ein 'e'-Atom an einem Ende und ein 'f'-Atom am anderen Ende, dazwischen 'a'-'d'.
makeladder.error.1		= Zu viele Atome an der Vorlage.
makeladder.error.2		= Zu wenige Atome an der Vorlage.
makeladder.error.3		= Die Atome müssen passende Typen haben.
makeladder.error.4		= Kopf-/Endatome müssen 2 Bindungen haben.
makeladder.error.5		= Die mittleren Atome müssen 3 Bindungen haben.

#selfrep
selfrep.title		= Replikation
selfrep.challenge	= <p>Erstelle eine frei schwebende Kopie des Moleküls. Wähle Reaktionen, die bei jeder Sequenz funktionieren.</p>
selfrep.hint		=
selfrep.error.1		= Ein Molekül hat nicht die richtige Größe.
selfrep.error.2		= Ein Molekül hat nicht die Form e-x-...-y-f.
selfrep.error.3		= Ein Molekül ist keine lineare Kette.
selfrep.error.4		= Ein Molekül hat nicht die richtige Sequenz.
selfrep.error.5		= Keine Kopien gefunden. (nicht einmal das Original)
selfrep.error.6		= Keine zwei Kopien gefunden.
selfrep.error.7		= Ein Molekül enthält kein 'e'

#growmembrane
growmembrane.title		= Wachstum
growmembrane.challenge	= <p>(Membran-Aufgabe 1 von 3)<br>Lass die Membran wachsen, sodass alle verfügbaren 'a'-Atome eingeschlossen werden. Stelle sicher, dass das f1-Atom weiterhin innen gefangen ist (und nichts anderes).</p>
growmembrane.hint		= Benutze das a3a4-Paar als Tor.
growmembrane.error.1	= Die Membran sollte eine saubere Schleife aus 'a'-Atomen sein.
growmembrane.error.2	= Das ursprüngliche 'f'-Atom ist nicht in der Membran.
growmembrane.error.3	= Nicht alle 'a'-Atome sind in der Membran.

#membranetransport
membranetransport.title		= Transport
membranetransport.challenge	= <p>(Membran-Aufgabe 2 von 3)<br>Bringe alle 'e'-Atome aus der Membran heraus und alle 'f'-Atome hinein. Lass das 'b'-Atom innen.</p>
membranetransport.hint		=
membranetransport.error.1	= Die Membran sollte eine saubere Schleife aus 'a'-Atomen sein.
membranetransport.error.2	= Das ursprüngliche 'b'-Atom ist nicht in der Membran.
membranetransport.error.3	= Alle 'f'-Atome sollten in der Membran sein.
membranetransport.error.4	= Nur 'f'-Atome und das ursprüngliche 'b'-Atom sollten in der Membran sein.

#membranedivision
membranedivision.title		= Teilung
membranedivision.challenge	= <p>(Membran-Aufgabe 3 von 3)<br>Teile die Zelle in zwei vollständig getrennte Tochterzellen.</p>
membranedivision.hint		=
membranedivision.error.1	= Die ursprüngliche Membran sollte in zwei geteilt werden.
membranedivision.error.2	= Die zwei Schleifen sollten nur aus den ursprünglichen Atomen bestehen.
membranedivision.error.3	= Jede Membran sollte eine saubere Schleife aus 'a'-Atomen sein.

#celldivision
celldivision.title		= Zelle
celldivision.challenge	= <p> == Große Herausforderung ==<br>Erstelle eine frei schwebende Kopie der Zelle. Die Anzahl der Atome in der Membran kann variieren, aber die Sequenz der Atomtypen in der Vorlage muss exakt kopiert werden. Das ätzende Mittel löst Bindungen zwischen Atomen, die es berührt. Nur 'a'-Atome sind dagegen immun. (Die Idee: du musst alles jederzeit innerhalb einer Membran halten.) Wähle Reaktionen, die bei jeder Sequenz funktionieren, da sich die Atome zwischen den 'e'- und 'f'-Markern bei jedem Zurücksetzen ändern.</p>
celldivision.hint		=
celldivision.error.1	= Es sollte genau zwei verbundene Atomgruppen geben.
celldivision.error.2	= Die zwei Zellen sollten vollständig getrennt sein.
celldivision.error.3	= Konnte keine zwei 'e'-Atome mit jeweils genau zwei Bindungen finden.
celldivision.error.4	= Vorlagen-Köpfe ('e'-Atome) sollten in getrennten Zellen sein.
celldivision.error.5	= Falsche Vorlagen-Sequenz erkannt.
celldivision.error.6	= Gefundene Vorlagen unterscheiden sich.

#playground
playground.title		= Spielplatz
playground.challenge	= <p>Mach mit diesem riesigen Level, was du willst</p>
playground.hint			=
