# Evoloom — near-black, slightly warm surfaces with subtle borders and a
# gold membrane accent. Overrides the FlatDarkLaf base variables;
# component colors derive from them via tint/shade functions.

@background = #0e0e10
@foreground = #c8c8c8
@accentColor = #d4a64f

textInactiveText = #7a7a7a

TitlePane.background = #08080a

# Subtle white-on-dark borders and rounded corners like the Evoloom
# cards: --border-subtle rgba(255,255,255,.06), --border-emph .14,
# --r-md 7px.
Component.borderColor = #1e1e22
Component.disabledBorderColor = #17171a
Component.focusedBorderColor = #2e2e33
Component.arc = 7
Button.arc = 7
Button.borderColor = #26262b
ComboBox.arc = 7
Spinner.arc = 7
TextComponent.arc = 7
ScrollPane.arc = 7
ProgressBar.arc = 7
TabbedPane.arc = 7

# Section headers tinted with the accent like the Evoloom card labels
TitledBorder.titleColor = #d4a64f
